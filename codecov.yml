coverage:
    status:
        project:
            default:
                # Avoid failing PRs while coverage is being ramped up across the monorepo.
                informational: true
        patch:
            default:
                informational: true

comment:
    layout: "reach, diff, flags, files"
    behavior: default
    require_changes: false

ignore:
    - "**/dist/**"
    - "**/test/**"
    - "**/tests/**"
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "**/samples/**"
